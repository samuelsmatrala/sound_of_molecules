<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiq — Quantum Sonic Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 400px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        select {
            background-color: #334155;
            color: white;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #fbbf24;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Musiq Studio</h1>
        <p>Preveďte kvantový obvod na zvuk a melódiu.</p>

        <label for="moleculeSelect">Vyberte molekulu:</label>
        <select id="moleculeSelect">
            <option value="H3+">H3+</option>
            <option value="H2">H2</option>
            <option value="H2+">H2+</option>
            <option value="HeH+">HeH+</option>
            <option value="Li+">Li+</option>
            <option value="H4">H4</option>
        </select>

        <button onclick="runQuantumAudio()">Spustiť kvantový výpočet</button>

        <div id="status">Pripravené na spustenie.</div>

        <!-- Prehrávač pre vygenerovaný WAV súbor -->
        <audio id="audioPlayer" controls style="display: none;"></audio>
    </div>

    <script>
        function runQuantumAudio() {
            const statusDiv = document.getElementById('status');
            const molecule = document.getElementById('moleculeSelect').value;
            const audioPlayer = document.getElementById('audioPlayer');

            statusDiv.textContent = `Počítam obvod pre ${molecule}... (Simulácia)`;
            
            // Sem neskôr môžete prepojiť backend / API, ktoré spustí Python skript
            setTimeout(() => {
                statusDiv.textContent = "Hotovo! Súbor je pripravený.";
                // audioPlayer.src = "melodia.wav"; // tu sa načte hotový súbor
                // audioPlayer.style.display = "block";
            }, 2000);
        }
    </script>

</body>
</html>
